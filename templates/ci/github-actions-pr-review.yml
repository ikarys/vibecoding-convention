# Skeleton: review incoming pull requests against the convention's commit rules
# (attribution trailers, test changes, new dependencies, secrets, leftover
# markers) without running the full repository check. For the owner's CI;
# the contributor rules themselves are stated in CONTRIBUTING.md (D8).
name: PR review

on:
  pull_request:

env:
  VIBECHECK_VERSION: v0.4.0

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the range BASE..HEAD needs the full history
      - name: Fetch the base branch
        run: git fetch origin ${{ github.base_ref }}
      - name: Install vibecheck
        run: |
          curl -fsSLO "https://github.com/ikarys/vibecoding-convention/releases/download/${VIBECHECK_VERSION}/vibecheck-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "https://github.com/ikarys/vibecoding-convention/releases/download/${VIBECHECK_VERSION}/SHA256SUMS"
          sha256sum --check --ignore-missing SHA256SUMS
          tar -xzf vibecheck-x86_64-unknown-linux-gnu.tar.gz
          sudo install -m 755 vibecheck /usr/local/bin/vibecheck
      - name: Review the pull request
        run: vibecheck . --pr-review origin/${{ github.base_ref }} --strict   # drop --strict to let warnings through
