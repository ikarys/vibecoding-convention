# Skeleton: run the project's tools, write their outputs as evidence files,
# let vibecheck compute audit/status.json, commit both on the default branch.
# Replace every <placeholder>; the paths must match `evidence` in VIBECODING.md.
name: CI

on:
  push:
    branches: [<default-branch>]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to commit the status and evidence back
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # vibecheck reads the history (trailers, release tags)
      # <toolchain setup, for example actions/setup-node or dtolnay/rust-toolchain>
      - name: Test
        run: <commands.test>
      - name: Coverage evidence
        run: |
          set -o pipefail
          mkdir -p audit/evidence
          <commands.coverage> | tee audit/evidence/coverage.txt
      - name: Audit evidence
        run: |
          set -o pipefail
          mkdir -p audit/evidence
          <commands.audit> | tee audit/evidence/audit.json
      # Install vibecheck from source; a release binary will follow.
      - name: Install vibecheck
        run: cargo install --git https://github.com/ikarys/vibecoding-convention vibecheck
      - name: Convention check
        run: vibecheck . --write-status --strict
      - name: Commit status and evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/<default-branch>'
        run: |
          git add audit/status.json audit/evidence
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'ci: refresh convention status and evidence [skip ci]'
          git push
