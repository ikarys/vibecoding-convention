# Stands in for CI while the repository is private. Install once: pre-commit install
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path vibecheck/Cargo.toml --check
        language: system
        pass_filenames: false
        files: ^vibecheck/.*\.rs$
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --manifest-path vibecheck/Cargo.toml --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: ^vibecheck/
        stages: [pre-push]
      - id: cargo-test
        name: cargo test
        entry: cargo test --manifest-path vibecheck/Cargo.toml
        language: system
        pass_filenames: false
        files: ^vibecheck/
        stages: [pre-push]
      # Runs again at pre-push because only then do the new commits and their
      # trailers exist for D3 and D6 to read.
      - id: vibecheck
        name: vibecheck
        entry: cargo run --quiet --manifest-path vibecheck/Cargo.toml -- .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
