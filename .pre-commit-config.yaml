# Install once: pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path vibecheck/Cargo.toml --check
        language: system
        pass_filenames: false
        files: ^vibecheck/.*\.rs$
