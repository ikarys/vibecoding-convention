# The tag message is the release note, written by the human approver (the convention's release skill drafts it), so the workflow never invents text.
name: Release

on:
  push:
    tags: [v*]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-08
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --manifest-path vibecheck/Cargo.toml --target ${{ matrix.target }}
      - name: Pack release artifact
        run: |
          mkdir -p dist
          cp "vibecheck/target/${{ matrix.target }}/release/vibecheck" dist/vibecheck
          cp LICENSE dist/LICENSE
          tar -czf "vibecheck-${{ matrix.target }}.tar.gz" -C dist vibecheck LICENSE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vibecheck-${{ matrix.target }}
          path: vibecheck-${{ matrix.target }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Compute SHA256SUMS
        run: |
          cd dist
          sha256sum vibecheck-*.tar.gz > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release create "$GITHUB_REF_NAME" vibecheck-*.tar.gz SHA256SUMS --notes-from-tag
