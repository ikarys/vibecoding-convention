[package]
name = "vibecheck"
version = "0.1.0"
edition = "2021"
description = "Mechanical validator for the Vibecoding Convention"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "vibecheck"
path = "src/main.rs"

[profile.release]
strip = true
